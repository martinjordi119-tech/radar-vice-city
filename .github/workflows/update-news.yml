name: Actualizar noticias GTA VI
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar-noticias
  cancel-in-progress: true
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recopilar titulares RSS
        run: python scripts/update_news.py
      - name: Guardar cambios
        run: |
          if [[ -n "$(git status --porcelain data/news.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "Actualizar titulares de GTA VI"
            git push
          else
            echo "No hay cambios en las noticias."
          fi
